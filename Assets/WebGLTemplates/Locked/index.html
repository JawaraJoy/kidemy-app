<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity WebGL Player</title>
  <style>
    html,
    body {
      background: #000;
      width: 100%;
      height: 100%;
      padding: 0;
      margin: 0;
      overflow: hidden;
    }

    #unity-container {
      width: 100%;
      height: 100%;
      position: absolute;
      /* Menghilangkan ketergantungan posisi statis */
      top: 0;
      left: 0;
      display: grid;
      place-items: center;
      /* Canvas otomatis di tengah */
      background: #111;
      /* Warna latar belakang area kosong (letterbox) */
    }

    #unity-canvas {
      /* Hapus width: 100% dan height: 100% dari CSS bawaan */
      display: block;
      background: #231f20;
    }

    #unity-loading-bar {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-family: sans-serif;
    }
  </style>
</head>

<body>
  <div id="unity-container">
    <canvas id="unity-canvas"></canvas>
    <div id="unity-loading-bar">Loading... <span id="unity-progress">0%</span></div>
  </div>
  <script>
    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressSpan = document.querySelector("#unity-progress");
    const refRes = {
      width: 1440,
      height: 840
    };

    const doResize = (function () {
      const targetRatio = refRes.width / refRes.height;

      // 2. Ambil ukuran riil dari kontainer iframe tempat game berada
      const containerWidth = container.clientWidth;
      const containerHeight = container.clientHeight;
      const containerRatio = containerWidth / containerHeight;

      let finalWidth, finalHeight;

      // 3. Hitung penskalaan yang pas tanpa merusak aspek rasio
      if (containerRatio > targetRatio) {
        // Jika iframe terlalu lebar (ada area kosong di kiri-kanan)
        finalHeight = containerHeight;
        finalWidth = containerHeight * targetRatio;
      } else {
        // Jika iframe terlalu tinggi (ada area kosong di atas-bawah)
        finalWidth = containerWidth;
        finalHeight = containerWidth / targetRatio;
      }

      // 4. Set ukuran baru ke style canvas agar proporsional
      canvas.style.width = finalWidth + "px";
      canvas.style.height = finalHeight + "px";
    });

    doResize();

    // Daftarkan event listener bawaan browser
    window.addEventListener('resize', doResize);
    window.addEventListener('orientationchange', doResize);

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
    var config = {
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "{{{ COMPANY_NAME }}}",
      productName: "{{{ PRODUCT_NAME }}}",
      productVersion: "{{{ PRODUCT_VERSION }}}",
      devicePixelRatio: window.devicePixelRatio || 1,
      matchWebGLToCanvasSize: true,
    };

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        // 1. First Phase: Loading Unity engine files (0% to 100%)
        progressSpan.textContent = "Loading Engine: " + Math.floor(100 * progress) + "%";
      }).then((unityInstance) => {
        // DO NOT hide loadingBar yet!
        progressSpan.textContent = "Preparing voice assets...";

        // 2. Global JS functions exposed for C# to call
        window.UpdateVoiceProgress = function (current, total) {
          var percentage = Math.floor((current / total) * 100);
          progressSpan.textContent = "Downloading Voices: " + percentage + "% (" + current + "/" + total + ")";
        };

        window.OnVoiceDownloadComplete = function () {
          progressSpan.textContent = "Complete!";
          loadingBar.style.display = "none"; // Hide loading bar ONLY when C# finishes
        };

      }).catch((message) => {
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>

</html>
