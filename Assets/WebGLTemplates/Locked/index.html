<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity WebGL Player</title>
  <style>
    html,
    body {
      background: #000;
      width: 100%;
      height: 100%;
      padding: 0;
      margin: 0;
      overflow: hidden;
    }

    #unity-container {
      width: 100%;
      height: 100%;
      position: relative;
      display: grid;
      place-items: center;
    }

    #unity-canvas {
      background: #231f20;
    }

    #unity-loading-bar {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-family: sans-serif;
    }
  </style>
</head>

<body>
  <div id="unity-container">
    <canvas id="unity-canvas"></canvas>
    <div id="unity-loading-bar">Loading... <span id="unity-progress">0%</span></div>
  </div>
  <script>
    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressSpan = document.querySelector("#unity-progress");
    const refRes = {
      width: 1440,
      height: 840
    };

    const doResize = (function () {
      const widthScreen = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;
      const heightScreen = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight;

      const deviceAspect = widthScreen / heightScreen;
      const refAspect = refRes.width / refRes.height;

      let finalWidth, finalHeight;

      if (deviceAspect > refAspect) {
        finalHeight = heightScreen;
        finalWidth = refRes.width * (heightScreen / refRes.height);
      } 
      else {
        finalWidth = widthScreen;
        finalHeight = refRes.height * (widthScreen / refRes.width);
      }

      // Set the internal rendering buffer size
      canvas.width = finalWidth;
      canvas.height = finalHeight;

      // FIX: Force the CSS display sizes to match the exact calculations
      canvas.style.width = finalWidth + "px";
      canvas.style.height = finalHeight + "px";
      
      // Optional: Center the canvas in the 100% x 100% iframe if desired
      container.style.display = "flex";
      container.style.justifyContent = "center";
      container.style.alignItems = "center";
    });

    doResize();

    window.onresize = () => {
      doResize();
    };

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
    var config = {
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "{{{ COMPANY_NAME }}}",
      productName: "{{{ PRODUCT_NAME }}}",
      productVersion: "{{{ PRODUCT_VERSION }}}",
      devicePixelRatio: window.devicePixelRatio || 1,
      matchWebGLToCanvasSize: true,
    };

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        progressSpan.textContent = Math.floor(100 * progress) + "%";
      }).then((unityInstance) => {
        loadingBar.style.display = "none";
      }).catch((message) => {
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>

</html>
